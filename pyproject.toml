[project]
name = "aais"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Markk", email = "2markkhomenko@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "html5lib>=1.1",
    "jupyter>=1.1.1",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "yfinance>=1.7.0",
]

[project.scripts]
aais = "aais:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
